<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Brotas - Controle de Fila</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0056b3;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f8f9fa;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: var(--primary);
      text-align: center;
      margin-top: 0;
    }
    .form-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    input, select, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    button.btn-add {
      background-color: var(--success);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button.btn-add:hover {
      background-color: #218838;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #e9ecef;
    }
    .btn-del {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      background-color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <h2><i class="fa-solid => fa-truck-ramp-box"></i> Bio Brotas - Fila do Balanceiro</h2>

  <!-- FORMULÁRIO DE REGISTRO -->
  <form id="filaForm" class="form-group">
    <input type="text" id="motorista" placeholder="Nome do Motorista" required>
    <input type="text" id="placa" placeholder="Placa do Veículo" required>
    <select id="produto" required>
      <option value="">Selecione o Produto...</option>
      <option value="Óleo Vegetal">Óleo Vegetal</option>
      <option value="Gordura Animal">Gordura Animal</option>
      <option value="Insumos">Insumos</option>
      <option value="Outros">Outros</option>
    </select>
    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> Registrar</button>
  </form>

  <!-- TABELA DA FILA -->
  <table>
    <thead>
      <tr>
        <th>Horário</th>
        <th>Motorista</th>
        <th>Placa</th>
        <th>Produto</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaFila">
      <tr><td colspan="5" style="text-align:center;">Carregando dados em tempo real...</td></tr>
    </tbody>
  </table>
</div>

<!-- INTEGRAÇÃO COM FIRESTORE EM TEMPO REAL -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Configuração do seu projeto no Firebase
  const firebaseConfig = {
    projectId: "biobrotas-controle-de-fila"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const filaRef = collection(db, "fila_balanceiro");

  const form = document.getElementById("filaForm");
  const tabela = document.getElementById("tabelaFila");

  // 1. Cadastrar veículo no Firestore
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const motorista = document.getElementById("motorista").value;
    const placa = document.getElementById("placa").value;
    const produto = document.getElementById("produto").value;

    try {
      await addDoc(filaRef, {
        motorista,
        placa,
        produto,
        criadoEm: serverTimestamp()
      });
      form.reset();
    } catch (err) {
      alert("Erro ao salvar: " + err.message);
    }
  });

  // 2. Escutar atualizações em Tempo Real (Sincronização Instantânea)
  const q = query(filaRef, orderBy("criadoEm", "asc"));
  onSnapshot(q, (snapshot) => {
    tabela.innerHTML = "";
    if (snapshot.empty) {
      tabela.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhum veículo na fila.</td></tr>`;
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      const hora = data.criadoEm ? new Date(data.criadoEm.toDate()).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : 'Aguardando...';

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="status-badge">${hora}</span></td>
        <td><strong>${data.motorista}</strong></td>
        <td>${data.placa}</td>
        <td>${data.produto}</td>
        <td><button class="btn-del" onclick="removerDoc('${id}')"><i class="fa-solid fa-trash"></i></button></td>
      `;
      tabela.appendChild(tr);
    });
  });

  // Função global para remover registro
  window.removerDoc = async (id) => {
    if (confirm("Deseja remover este veículo da fila?")) {
      await deleteDoc(doc(db, "fila_balanceiro", id));
    }
  };
</script>

</body>
</html>
